format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

[gradle]
symbol = " "
format = '[$symbol($version )]($style)'

[haskell]
symbol = " "
format = "[$symbol($version )]($style)"

[haxe]
